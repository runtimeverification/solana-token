name: Proof Smoke Test

on:
  push:
    branches: [proofs]
  pull_request:
    branches: [proofs]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: "Compile ${{ matrix.target }} SMIR"
    runs-on: [self-hosted, linux, normal]
    strategy:
      matrix:
        include:
          - target: p-token
            crate_dir: p-token
            artifact: p-token-smir
          - target: spl-token
            crate_dir: program
            artifact: spl-token-smir
    outputs:
      kompass-image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Set kompass image"
        id: version
        run: |
          VERSION=$(cat p-token/test-properties/deps/kompass_release)
          echo "image=ghcr.io/runtimeverification/kompass:ubuntu-jammy-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: "Build ${{ matrix.target }} with stable_mir_json"
        run: |
          docker run --rm \
            --entrypoint bash \
            -u 0:0 \
            -v $PWD:/workdir --workdir /workdir \
            -e CARGO_HOME=/tmp/cargo \
            -e RUSTUP_HOME=/rustup \
            ${{ steps.version.outputs.image }} \
            -c "cd ${{ matrix.crate_dir }} && RUSTC=/home/kmir/.stable-mir-json/release.sh cargo build --features runtime-verification,assumptions"

      - name: "Store SMIR JSON files"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./target/debug/deps/*.smir.json
          if-no-files-found: error
          retention-days: 1

  prove:
    name: "Prove ${{ matrix.target }}: ${{ matrix.proof }}"
    needs: compile
    runs-on: [self-hosted, linux, normal]
    strategy:
      fail-fast: false
      matrix:
        include:
          # p-token proofs
          - target: p-token
            artifact: p-token-smir
            prefix: "pinocchio_token_program::entrypoint::"
            proof: test_ptoken_domain_data
            timeout: 30
          - target: p-token
            artifact: p-token-smir
            prefix: "pinocchio_token_program::entrypoint::"
            proof: test_process_initialize_immutable_owner
            timeout: 30
          - target: p-token
            artifact: p-token-smir
            prefix: "pinocchio_token_program::entrypoint::"
            proof: test_process_revoke
            timeout: 30
          - target: p-token
            artifact: p-token-smir
            prefix: "pinocchio_token_program::entrypoint::"
            proof: test_process_initialize_multisig
            timeout: 30
          - target: p-token
            artifact: p-token-smir
            prefix: "pinocchio_token_program::entrypoint::"
            proof: test_process_get_account_data_size
            timeout: 30
          # spl-token proofs
          - target: spl-token
            artifact: spl-token-smir
            prefix: "spl_token::entrypoint::"
            proof: test_spltoken_domain_data
            timeout: 60
          - target: spl-token
            artifact: spl-token-smir
            prefix: "spl_token::entrypoint::"
            proof: test_process_initialize_immutable_owner
            timeout: 60
          - target: spl-token
            artifact: spl-token-smir
            prefix: "spl_token::entrypoint::"
            proof: test_process_revoke
            timeout: 60
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CONTAINER_NAME: "kompass-${{ matrix.target }}-${{ matrix.proof }}-${{ github.sha }}"
      KOMPASS_IMAGE: ${{ needs.compile.outputs.kompass-image }}
    steps:
      - name: "Start kompass container"
        run: |
          mkdir -p $PWD/artefacts
          chmod a+rwx $PWD/artefacts $PWD
          docker run --rm --detach \
            -u $(id -u):$(id -g) \
            -v $PWD:/workdir --workdir /workdir \
            --name "${CONTAINER_NAME}" \
            ${KOMPASS_IMAGE} \
            bash -c 'while true; do sleep 600; done'
          sleep 5

      - name: "Build K definitions (workaround: should be pre-built in image)"
        run: |
          docker exec "${CONTAINER_NAME}" \
            bash -c "kdist clean && kdist -v build kompass.haskell kompass.llvm-library -j2"

      - name: "Get SMIR files"
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artefacts/

      - name: "Link SMIR files"
        run: |
          docker exec --workdir /workdir/artefacts/ "${CONTAINER_NAME}" \
            bash -c "kmir link -o ${{ matrix.target }}.smir.json *.smir.json"

      - name: "Run proof: ${{ matrix.proof }}"
        run: |
          docker exec --workdir /workdir "${CONTAINER_NAME}" \
            kmir prove-rs \
              --smir artefacts/${{ matrix.target }}.smir.json \
              --start-symbol "${{ matrix.prefix }}${{ matrix.proof }}" \
              --verbose \
              --fail-fast \
              --proof-dir artefacts/proof \
              --haskell-target kompass.haskell \
              --llvm-lib-target kompass.llvm-library

      - name: "Show proof summary"
        if: always()
        run: |
          docker exec --workdir /workdir "${CONTAINER_NAME}" \
            kmir show \
              --statistics --leaves \
              --proof-dir artefacts/proof \
              "${{ matrix.target }}.smir.${{ matrix.prefix }}${{ matrix.proof }}" \
              --haskell-target kompass.haskell \
            || true

      - name: "Stop container"
        if: always()
        run: |
          docker stop "${CONTAINER_NAME}" || true
          docker rm -f "${CONTAINER_NAME}" || true
